name: Windows build

# Builds FA Editor for Windows and publishes a ready-to-run zip as a
# downloadable artifact on the workflow run page.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  QT_VERSION: '6.11.1'

jobs:
  windows:
    name: Windows x64
    runs-on: windows-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Set up Python for the Qt installer
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Qt for Windows
        shell: bash
        run: |
          python .github/scripts/install_qt_windows.py "$QT_VERSION" C:/Qt 2> qt-err.log | tee qt-install.log \
            || { echo "::error::Qt install failed: $(tail -c 1500 qt-err.log | tr '\n' ' ')"; exit 1; }
          QT_DIR=$(tail -1 qt-install.log)
          echo "::notice::Qt installed at $QT_DIR"
          echo "QT_ROOT_DIR=$QT_DIR" >> "$GITHUB_ENV"
          echo "$QT_DIR/bin" >> "$GITHUB_PATH"

      - name: Configure
        shell: bash
        run: >-
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_PREFIX_PATH="$QT_ROOT_DIR"

      - name: Build
        run: cmake --build build --parallel 4

      - name: Package with Qt runtime
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist/FAEditor | Out-Null
          Copy-Item build/FAEditor.exe dist/FAEditor/
          & "$env:QT_ROOT_DIR/bin/windeployqt.exe" --release --qmldir qml --no-translations dist/FAEditor/FAEditor.exe
          Copy-Item LICENSE, THIRD_PARTY_NOTICES.md dist/FAEditor/

      - name: Upload Windows zip
        uses: actions/upload-artifact@v4
        with:
          name: FAEditor-Windows-x64
          path: dist/FAEditor
          if-no-files-found: error

      - name: Test
        continue-on-error: true
        env:
          QT_QPA_PLATFORM: offscreen
        run: ctest --test-dir build --output-on-failure
